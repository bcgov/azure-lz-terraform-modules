# Reference documentation: https://azure.github.io/Azure-Landing-Zones/terraform/howtos/modifyingmghierarchy/
name: avm_alz_custom # This vaule must match the architecture_name parameter in the alz module call
management_groups:
  - id: bcgov-managed-lz-avm
    display_name: BCGov-Managed-LZ-AVM
    parent_id: null # NOTE: This means that the Management Group will be created at the parent as defined in the module configuration (ie. parent_resource_id).
    exists: false
    archetypes:
      - root_override
      - amba_root
  - id: bcgov-managed-lz-avm-decommissioned
    display_name: Decommissioned
    parent_id: bcgov-managed-lz-avm
    exists: false
    archetypes:
      - decommissioned_override
  - id: bcgov-managed-lz-avm-landingzones
    display_name: Landing Zones
    parent_id: bcgov-managed-lz-avm
    exists: false
    archetypes:
      - landing_zones_override
      # - amba_landing_zones
  - id: bcgov-managed-lz-avm-platform
    display_name: Platform
    parent_id: bcgov-managed-lz-avm
    exists: false
    archetypes:
      - platform_override
      # - amba_platform
  - id: bcgov-managed-lz-avm-management
    display_name: Management
    parent_id: bcgov-managed-lz-avm-platform
    exists: false
    archetypes:
      - management_override
      # - amba_management
  - id: bcgov-managed-lz-avm-connectivity
    display_name: Connectivity
    parent_id: bcgov-managed-lz-avm-platform
    exists: false
    archetypes:
      - connectivity_override
      # - amba_connectivity
  - id: bcgov-managed-lz-avm-identity
    display_name: Identity
    parent_id: bcgov-managed-lz-avm-platform
    exists: false
    archetypes:
      - identity_override
      # - amba_identity
  - id: bcgov-managed-lz-avm-security
    display_name: Security
    parent_id: bcgov-managed-lz-avm-platform
    exists: false
    archetypes:
      - security_override
  - id: bcgov-managed-lz-avm-sandboxes
    display_name: Sandboxes
    parent_id: bcgov-managed-lz-avm
    exists: false
    archetypes:
      - sandbox_override
